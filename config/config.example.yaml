model:
  provider_kind: openai_compatible
  model_name: deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key: replace-with-your-deepseek-api-key
  temperature: 0.0
  reasoning_effort: high
  extra_body:
    thinking:
      type: enabled
agent:
  tool_calling: true
  tool_calling_thinking_type: disabled
runtime:
  artifact_dir: .dbkit/artifacts
  invoke_llm: true
  interactive: false
  timezone: Asia/Shanghai
  locale: zh-CN
  repo_dir: .
  workspace_dir: .
  skills_dir: skills
  agents_dir: agents
  allowed_workspace_root: /workspace/
  max_discovered_files: 100
  max_evidence_file_size_bytes: 50000000
  blocked_paths:
    - /workspace/**/.env
    - /workspace/**/*.pem
collection:
  mysql:
    connect_timeout_seconds: 5
    read_timeout_seconds: 30
  ssh:
    connect_timeout_seconds: 5
    command_timeout_seconds: 30
  logs:
    max_bytes: 10485760
    tail_lines: 5000
  metrics:
    mysqld_exporter_url:
