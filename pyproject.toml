[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbkit"
version = "0.1.0"
description = "AI-native DBA analysis framework."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "weiqinzhou3" }
]
dependencies = []

[project.scripts]
dbkit = "dbkit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbkit = ["py.typed"]
