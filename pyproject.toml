[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbkit"
version = "0.1.0"
description = "AI-native DBA analysis framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "weiqinzhou3" }
]
dependencies = [
  "deepagents==0.5.7",
  "langchain-openai>=1.1.7,<2.0.0",
  "PyYAML>=6.0.3,<7.0.0"
]

[project.scripts]
dbkit = "dbkit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbkit = ["py.typed"]
